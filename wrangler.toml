name = "flare-image"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[observability]
enabled = true

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "flare-images"

[vars]
# 可选：自定义域名或 workers.dev 地址，用于生成返回的 url。
# 留空 / 注释时自动使用当前请求的 origin。
# PUBLIC_URL = "https://images.example.com"

# 账号可以直接写在 [vars] 里，也可以使用 Cloudflare 控制台的
# Settings -> Variables and Secrets，或用 wrangler secret 设置。
#
# 注意：如果仓库是公开的，不要把真实密码提交到 wrangler.toml。
# 生产环境建议只把用户名放在 [vars]，密码用 secret：
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put USER_PASSWORD
#
# ADMIN_USERNAME = "admin"
# ADMIN_PASSWORD = "change-me-admin"
# USER_USERNAME = "user"
# USER_PASSWORD = "change-me-user"
#
# 可选：会话签名密钥。修改后所有已登录会话立即失效。
# SESSION_SECRET = "a-long-random-string"

# 本地开发时把账号密码写入 .dev.vars（已在 .gitignore 中忽略）：
#   ADMIN_USERNAME="admin"
#   ADMIN_PASSWORD="..."
#   USER_USERNAME="user"
#   USER_PASSWORD="..."
